# Builds the API reference and publishes it to GitHub Pages.
#
# The build runs on pull requests too, without deploying. That is not just
# courtesy: `yarn docs` is strict — any TypeDoc warning fails it — so a broken
# {@link} or a type that reaches the public surface without being exported is
# caught on the branch rather than after it lands.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job asks for what it actually needs.
permissions:
  contents: read

# Pages recommends never cancelling an in-flight deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Do not publish a reference for code that does not pass its own tests.
      - run: yarn test

      - run: yarn docs

      # No configure-pages step: TypeDoc emits relative links only, so there is
      # no base path to inject for project-repo hosting under /domain-tools/.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: typedoc/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
